name: audit

# 依赖漏洞审计（执行计划 §1.5）：每周 cron + 手动触发。
on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        # 忽略「无修复且本项目不可达」的传递性告警（均有理由）：
        # RUSTSEC-2023-0071 rsa Marvin —— 经 sqlx-mysql 传递，本项目仅用 SQLite，从不走 RSA 路径；
        # RUSTSEC-2024-0429 glib unsound —— 来自 Linux WebKitGTK 依赖链，双端为 mac/win，不涉及。
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0429

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
