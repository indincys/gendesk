name: release

# 推送 tag v* 触发：只打 Windows 包。Mac 包由本机 `pnpm release <版本>` 同时打包上传
# （scripts/release.mjs）。两端各写自己的 updater-<平台>.json，再拼成 latest.json
# （scripts/updater-manifest.mjs），所以可以并行，不会互相覆盖。
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: windows-latest # x64 NSIS per-user（Windows 10/11）
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign 私钥与密码存于仓库 Secrets（私钥丢失 = 更新链断裂，另做离线备份）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GenDesk ${{ github.ref_name }}"
          releaseBody: "详见 CHANGELOG。首次运行的 SmartScreen / Gatekeeper 放行指引见 README。"
          # 必须直接发布（非草稿）：updater endpoint 仅解析已发布 release，
          # 草稿会导致 releases/latest/download/latest.json 404，自动更新链断裂。
          releaseDraft: false
          prerelease: false
          # latest.json 由下一步按平台拼装；tauri-action 自己的「读-改-写」会和本机那端互相覆盖。
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: 把 Windows 包写进 latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sig=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig | head -1)
          asset=$(basename "${sig%.sig}")
          node scripts/updater-manifest.mjs add --tag "$TAG" --platform windows --asset "$asset" --sig-file "$sig"

  # 发布后自检更新链：latest.json 必须含两个平台，且每个平台的更新包可下载。
  # Mac 那端在本机打包，可能比这里晚完成，所以最多等 40 分钟。任一平台缺失 → 红叉。
  verify-updater:
    needs: publish
    if: always() # 即使 Windows 构建失败也要跑：正是这种情况最需要暴露 latest.json 不完整
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验 latest.json 平台完整且更新包可下载
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updater-manifest.mjs verify --tag "${{ github.ref_name }}" --wait 40
