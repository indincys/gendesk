[package]
name = "gendesk"
version = "0.32.0"
description = "GenDesk — 内部图片生产工具"
authors = ["GenDesk"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 需要 cdylib（移动端）+ staticlib，同时保留 rlib 供集成测试引用引擎逻辑。
name = "gendesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png`：关窗之后进程要继续跑（轮询器 / 两个 watcher / 常驻补单），
# 而一个没有任何界面痕迹的后台进程与「已经退出了」在用户那里长得一模一样。
# 托盘图标是它唯一的存在证明，也是把窗口叫回来的入口。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# 启动初始化失败时的原生对话框。**不能**用 tauri-plugin-dialog：它的 blocking API
# 文档明写「不得在主线程调用」，而 setup 钩子正在主线程；它的非阻塞 API 又要求事件
# 循环已经跑起来，而失败发生在那之前。故直接用该插件底层的 rfd（同版本，特性合一后
# 仍是同一份，不会多编一遍）。
rfd = { version = "0.16", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"

# 异步运行时（调度循环、per-Key Semaphore；M1 起用于数据层测试）。
# `process`：即梦 CLI 的子进程要能**超时后被杀掉**（`v2v::dreamina::run`）。
# std::process 的 `output()` 没有超时可言，而 CLI 一挂，那条 IPC 就永不返回。
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "process",
] }

# 生图 API 调用（rustls 免 OpenSSL）
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "multipart",
    "json",
    "stream",
] }

# 数据层
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# API Key 密钥文件加密（XChaCha20-Poly1305；默认特性含 getrandom → OsRng 出主密钥/nonce）
chacha20poly1305 = "0.10"

# 旧版密钥来源：系统钥匙串。仅供 secrets::migrate_from_keyring 一次性迁移读取，
# 迁移期结束后随 KeyringStore 一并移除（见 docs/V2-backlog.md）。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 缩略图生成 / 格式转换（输出统一 JPG）
image = "0.25"

# JPEG 的 DCT 缩放解码（`files::decode`）。image 0.25 走 zune-jpeg，而 zune-jpeg 至今
# 没有任何缩放解码入口（`decode`/`decode_into`/`decode_headers`/`set_options` 而已），
# 于是一张 26 MP 相机图为了做 240 px 缩略图也要物化 78 MB 位图——那正是「点确认工单
# CPU 拉爆 600%」的本体。jpeg-decoder 的 `scale()` 按 1/2·1/4·1/8 走 DCT 缩放，
# 内存直接掉到 ~1.2 MB。它是 image 0.25 之前自带的解码器，不是冷门物件。
# **只在能确定安全时使用**：非 JPEG、非 RGB24/L8 像素格式、任何解码错误一律回落 image。
# **必须 default-features = false**：它默认开 rayon，一次解码就会摊到全部核上，
# 那样 `files::decode` 的信号量就只是在数「同时有几张图在解」而不是在数核，封顶失效。
# 单线程解码 + 信号量 = 许可数就是核数上限，这才是可预测的桌面行为。
jpeg-decoder = { version = "0.3", default-features = false }

# 提示词 txt 导入：GBK/UTF-8 编码探测
encoding_rs = "0.8"
chardetng = "0.1"

# 发布模块：收件箱/任务包文件监听、任务单 xlsx 读写、日期/时段计算
notify = "8"
rust_xlsxwriter = "0.90"
calamine = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 数据备份打包（E19，DB + 资产目录 → zip）
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
walkdir = "2"

# IPC 契约自动生成（specta + tauri-specta，禁手改 bindings.ts）
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }

# 结构化日志滚动落盘
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
wiremock = "0.6"
futures = "0.3"

# --- Lints：机器强制铁律（执行计划 §1.2）。非测试代码禁 unwrap/expect/panic。---
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# 允许在测试中使用（通过 #[cfg(test)] 模块的 allow 局部放开）

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
